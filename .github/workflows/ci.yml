name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Build & check (NuminousCore)
    # GitHub's macOS runners ship a full Xcode — so CI can build and test what a
    # Command-Line-Tools-only machine cannot.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Run checks
        run: swift run numinous-checks

  ios-app:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # A .metal shader in the app target needs the Metal toolchain, which Xcode now ships
      # as a separately downloadable component — a runner without it fails with "cannot
      # execute tool 'metal'", which reads like a code error and isn't one. Idempotent.
      - name: Ensure Metal toolchain
        run: |
          if ! xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q "Status: installed"; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Build app (iOS Simulator SDK)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Numinous.xcodeproj \
            -scheme Numinous \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      # Logs are sign-in gated for anonymous viewers, so echo the real compiler
      # errors as annotations (readable via the public check-runs API).
      - name: Surface build errors
        if: failure()
        run: |
          echo "===== extracted errors ====="
          if grep -qE "error:" build.log; then
            grep -nE "error:" build.log | while IFS= read -r l; do echo "::error::$l"; done
          else
            tail -60 build.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
