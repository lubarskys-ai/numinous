name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Build & check (NuminousCore)
    # GitHub's macOS runners ship a full Xcode — so CI can build and test what a
    # Command-Line-Tools-only machine cannot.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Run checks
        run: swift run numinous-checks

  ios-app:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (iOS Simulator SDK)
        run: >
          xcodebuild build
          -project Numinous.xcodeproj
          -scheme Numinous
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
