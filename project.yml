# XcodeGen spec. CI runs `xcodegen generate` to produce Numinous.xcodeproj, then
# builds it — so the iOS app compiles on GitHub's full-Xcode runners even though
# this dev machine only has Command Line Tools. Regenerate locally the same way
# once a full Xcode is available.
name: Numinous
options:
  bundleIdPrefix: com.lubarskys
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  NuminousCore:
    path: Core

targets:
  Numinous:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: NuminousCore
        product: NuminousCore
    entitlements:
      path: App/Numinous.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lubarskys.numinous
        PRODUCT_NAME: Numinous
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # App UI builds in Swift 5 language mode to avoid strict-concurrency
        # friction in SwiftUI glue; NuminousCore stays on Swift 6 (tools 6.0).
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Phone-first app: run full screen (no iPad split-view), which exempts us
        # from the "support all four orientations" iPad rule that blocks the build.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_CFBundleDisplayName: Numinous
        # Declares no non-exempt encryption, so TestFlight skips the export-
        # compliance prompt on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSContactsUsageDescription: "Numinous reads your contacts on your device to fill your People folder. They are never uploaded."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Numinous fills in where you were on your device so a note remembers its place. Your location is never uploaded."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Numinous reads your calendar on your device so you can turn events into notes. Nothing is uploaded."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Numinous reads your calendar and can add events you create from a note. Nothing is uploaded."
        INFOPLIST_KEY_NSRemindersUsageDescription: "Numinous creates follow-up reminders from your notes, and rewards you when you complete them. Nothing is uploaded."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Numinous creates follow-up reminders from your notes, and rewards you when you complete them. Nothing is uploaded."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Numinous reads workouts and mindful minutes on your device so you can turn them into notes that grow Body and Spirit. Nothing is uploaded."
        # DEV ONLY — supports HealthKitService.seedSampleData() (#if DEBUG). The app
        # never writes to Health in a release build. Remove this key before App Store
        # submission so we don't declare write access we don't use.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Used only in development to write sample workouts and mindful sessions for testing."
        # Signing is driven per-invocation: CI passes CODE_SIGNING_ALLOWED=NO for the
        # simulator build (ci.yml) and =YES for the TestFlight archive (testflight.yml).
        # For local device runs from Xcode, automatic signing picks up your Team below.
        CODE_SIGN_STYLE: Automatic
